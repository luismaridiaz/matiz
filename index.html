const fitzDepth = f => ["I","II"].includes(f)?"clara":["III","IV"].includes(f)?"media":"oscura";

// ── QUIZ (4 preguntas — profundidad vía Fitzpatrick) ──────────
const QUIZ = [
  {id:"venas",   q:"Mira las venas de tu muñeca bajo luz natural",
   ops:[{l:"Verdes o verde-amarillentas",v:"calido",e:"🟢"},{l:"Azules o azul-violáceas",v:"frio",e:"🔵"},{l:"Mezcla de ambas",v:"neutro",e:"🟣"}]},
  {id:"joyeria", q:"¿Qué metal te favorece más en el rostro?",
   ops:[{l:"El oro me sienta mejor",v:"calido",e:"🥇"},{l:"La plata me sienta mejor",v:"frio",e:"🥈"},{l:"Ambos me quedan igual",v:"neutro",e:"✨"}]},
  {id:"papel",   q:"Acerca un papel blanco a tu rostro. Tu piel se ve...",
   ops:[{l:"Amarillenta, dorada o melocotón",v:"calido",e:"🌕"},{l:"Rosada, azulada o sin color",v:"frio",e:"🌸"},{l:"Neutra, sin sesgo claro",v:"neutro",e:"⚪"}]},
  {id:"contraste",q:"Contraste entre piel, cabello y ojos",
   ops:[{l:"Muy alto — combinación dramática",v:"alto",e:"🌓"},{l:"Medio — diferencia moderada",v:"medio",e:"🌗"},{l:"Bajo — todo en la misma gama",v:"bajo",e:"🌕"}]},
];

const calcSeason = (a, fitz) => {
  const v=[a.venas,a.joyeria,a.papel];
  const c={}; v.forEach(x=>c[x]=(c[x]||0)+1);
  const sub=Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
  const ct=a.contraste, p=fitzDepth(fitz||"III");
  if(sub==="calido"&&p==="clara"&&ct!=="alto") return "primavera";
  if(sub==="calido"&&p==="media"&&ct==="bajo")  return "primavera";
  if(sub==="frio"  &&ct!=="alto")               return "verano";
  if(sub==="calido"&&(p==="media"||p==="oscura")) return "otono";
  if(sub==="calido"&&ct==="alto")               return "otono";
  if(sub==="frio"  &&ct==="alto")               return "invierno";
  if(sub==="neutro"&&ct==="alto")               return "invierno";
  if(sub==="neutro"&&p==="oscura")              return "otono";
  return "verano";
};

const AGE_RECS=a=>{
  if(!a) return null;
  if(a<=29) return {sat:"Alta",base:"Satinada o dewy",lab:"Mate o satinado",tip:"Experimenta libremente — cualquier acabado funciona."};
  if(a<=39) return {sat:"Media-alta",base:"Dewy",lab:"Satinado",tip:"El dewy realza la luminosidad natural."};
  if(a<=49) return {sat:"Media",base:"Luminosa",lab:"Cremoso",tip:"Iluminador estratégico en crestas malares. Evitar polvos en zonas secas."};
  if(a<=59) return {sat:"Media-baja",base:"Muy luminosa",lab:"Gloss o aceite",tip:"Técnica lifting visual: cejas ascendentes + rubor alto + iluminador."};
  return {sat:"Baja",base:"Hidratante",lab:"Aceite o laca",tip:"Siempre texturas cremosas. Evita polvos sueltos en todo el rostro."};
};

// ── CSS ───────────────────────────────────────────────────────
const CSS=`
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#14110e;--card:rgba(232,210,180,0.05);--bd:rgba(200,169,126,0.18);--gd:#c8a97e;--wt:#f5ede0;--st:rgba(200,169,126,0.65);--sh:0 2px 16px rgba(0,0,0,0.3);--br:14px}
body{background:var(--bg);color:var(--wt);font-family:'Jost',sans-serif;min-height:100vh}
.cg{font-family:'Cormorant Garamond',serif}
.gd{color:var(--gd)}
.btn{cursor:pointer;border:none;font-family:'Jost',sans-serif;outline:none;transition:all .2s}
.btn-g{background:var(--gd);color:#14110e;font-weight:500;padding:.7rem 1.8rem;border-radius:40px;font-size:.9rem;letter-spacing:.04em}
.btn-g:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-g:disabled{opacity:.35;transform:none;cursor:default;pointer-events:none}
.btn-o{background:transparent;border:1px solid var(--bd);color:var(--st);padding:.5rem 1.1rem;border-radius:40px;font-size:.78rem}
.btn-o:hover{border-color:var(--gd);color:var(--gd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--br);padding:1.3rem;box-shadow:var(--sh)}
.tag{display:inline-block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-family:'Jost',sans-serif;background:rgba(200,169,126,0.12);color:var(--gd);padding:.22rem .7rem;border-radius:4px}
.div{width:44px;height:1px;background:linear-gradient(to right,var(--gd),transparent);margin:.5rem 0 1.1rem}
.info{background:rgba(200,169,126,0.07);border:1px solid rgba(200,169,126,0.2);border-radius:10px;padding:.85rem 1rem;font-size:.81rem;color:rgba(245,237,224,.8);line-height:1.65}
.info strong,.info b{color:var(--gd)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.9rem}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
.sep{height:1px;background:var(--bd);margin:1rem 0}
input[type=range]{width:100%;accent-color:var(--gd)}
.acc{background:var(--card);border:1px solid var(--bd);border-radius:var(--br);overflow:hidden;margin-bottom:.7rem}
.acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;background:transparent;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:.87rem;font-weight:500;color:var(--wt);text-align:left;transition:background .2s}
.acc-h:hover{background:rgba(200,169,126,0.05)}
.acc-h.open{background:rgba(200,169,126,0.07);border-bottom:1px solid var(--bd)}
.acc-arr{font-size:.65rem;color:var(--st);transition:transform .25s;flex-shrink:0;margin-left:8px}
.acc-h.open .acc-arr{transform:rotate(180deg)}
.acc-b{padding:1.1rem}
.tier-tabs{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.tier-tab{font-family:'Jost',sans-serif;font-size:.75rem;padding:.35rem .9rem;border-radius:40px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--st);transition:all .2s}
.tier-tab.on{background:var(--gd);color:#14110e;border-color:var(--gd);font-weight:500}
`;

function Chip({h,n}){

}
function Pill({t}){
  return <span style={{display:"inline-block",background:"rgba(200,169,126,.1)",border:"1px solid rgba(200,169,126,.2)",borderRadius:40,padding:".22rem .75rem",fontSize:".75rem",color:"rgba(245,237,224,.8)",margin:".2rem .2rem"}}>{t}</span>;
}
function Acc({title,icon,open:o=false,children}){
  const [open,setOpen]=useState(o);
  return <div className="acc">
    <button className={`acc-h${open?" open":""}`} onClick={()=>setOpen(!open)}>
      <span>{icon} {title}</span><span className="acc-arr">▼</span>
    </button>
    {open && <div className="acc-b">{children}</div>}
  </div>;
}
function ProdTier({productos}){
  const [tier,setTier]=useState("eco");
  const labels={eco:"💚 Económico",medio:"🟡 Precio medio",caro:"💎 Premium"};
  const catIcon={"Base":"🧴","Rubor":"🌸","Labial":"💋","Sombras":"👁️","Delineado":"✏️","Iluminador":"✨","Máscara":"🪄","Prebase":"🫧","Fijador":"🔒","Corrector":"🎭"};
  const prods = productos[tier]||[];
  // Agrupar por categoría
  const byCat = {};
  prods.forEach(p=>{ if(!byCat[p.cat]) byCat[p.cat]=[]; byCat[p.cat].push(p); });
  return <>
    <div className="tier-tabs">
      {["eco","medio","caro"].map(t=>(
        <button key={t} className={`tier-tab${tier===t?" on":""}`} onClick={()=>setTier(t)}>{labels[t]}</button>
      ))}
    </div>
    {Object.entries(byCat).map(([cat,items])=>(
      <div key={cat} style={{marginBottom:".9rem"}}>
        <p style={{fontSize:".68rem",textTransform:"uppercase",letterSpacing:".1em",color:"var(--gd)",marginBottom:".45rem"}}>{catIcon[cat]||"·"} {cat}</p>
        <div className="g3">
          {items.map(p=>(
            <div key={p.ref} style={{background:"rgba(200,169,126,.05)",border:"1px solid var(--bd)",borderRadius:12,padding:".85rem"}}>
              <div style={{fontSize:".82rem",fontWeight:500,color:"var(--wt)",marginBottom:".2rem",lineHeight:1.3}}>{p.ref}</div>
              <div style={{fontSize:".8rem",color:"var(--gd)"}}>{p.p}</div>
              {p.nota&&<div style={{fontSize:".7rem",color:"var(--st)",marginTop:".18rem"}}>{p.nota}</div>}
            </div>
          ))}
        </div>
      </div>
    ))}
  </>;
}

      <style>{CSS}</style>
      <div style={{padding:"1rem 1.3rem",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid var(--bd)"}}>
        <button className="btn btn-o" onClick={()=>setScreen(season?"results":"home")}>← Atrás</button>
        <span className="cg" style={{color:"var(--gd)",fontStyle:"italic",fontSize:"1.1rem"}}>Luz & Metamerismo</span>
        <div style={{width:60}}/>
      </div>
      <div style={{maxWidth:740,margin:"0 auto",padding:"1.8rem 1.2rem"}}>
        <div className="info" style={{marginBottom:"1.4rem"}}>
          <b>Metamerismo:</b> un producto puede verse perfecto bajo luz natural y completamente distinto bajo LED de oficina — cada fuente tiene un espectro diferente que activa distintos pigmentos.
        </div>
        <div style={{display:"flex",gap:".55rem",flexWrap:"wrap",marginBottom:"1.3rem"}}>
          {LIGHTS.map(l=>(
            <button key={l.id} className="btn" style={{padding:".5rem .95rem",borderRadius:40,fontSize:".77rem",cursor:"pointer",border:`1px solid ${lightId===l.id?l.col:"rgba(200,169,126,.2)"}`,background:lightId===l.id?`${l.col}18`:"transparent",color:lightId===l.id?l.col:"rgba(245,237,224,.55)"}}
              onClick={()=>setLightId(l.id)}>
              {l.e} {l.n}
            </button>
          ))}
        </div>
        {light&&(
          <div className="card" style={{marginBottom:"1.3rem"}}>
            <div style={{display:"flex",alignItems:"center",gap:"1rem",marginBottom:".85rem"}}>
              <div style={{fontSize:"2.2rem"}}>{light.e}</div>
              <div style={{flex:1}}>
                <h3 className="cg" style={{fontSize:"1.2rem",fontWeight:300,color:light.col}}>{light.n}</h3>
                <span style={{fontSize:".7rem",color:"var(--st)"}}>{light.sub}</span>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="cg" style={{fontSize:"2.2rem",color:light.col,fontWeight:300,lineHeight:1}}>{light.cri}</div>
                <div style={{fontSize:".6rem",color:"var(--st)",textTransform:"uppercase"}}>CRI</div>
              </div>
            </div>
            <div style={{height:6,background:"rgba(200,169,126,.1)",borderRadius:6,overflow:"hidden",marginBottom:".8rem"}}>
              <div style={{height:"100%",width:`${light.cri}%`,background:light.col,borderRadius:6,transition:"width .5s"}}/>
            </div>
            <p style={{fontSize:".82rem",color:"rgba(245,237,224,.7)",lineHeight:1.6}}>
              {light.id==="d65"?"Referencia absoluta. Aquí los colores son reales. Una base perfecta bajo D65 es fiable en cualquier entorno.":
               light.id==="led_pro"?"Casi perfecto. Usado en estudios de maquillaje y cabinas profesionales. Mínima distorsión.":
               light.id==="fluor"?"Déficit en rojo (R9 bajo). La piel puede verse cetrina y el maquillaje apagado o grisáceo.":
               light.id==="led_malo"?"Distorsión notable. Una base 'perfecta' en casa puede volverse gris o anaranjada aquí.":
               "Distorsión extrema. Colores irreconocibles. Nunca elegir maquillaje bajo esta luz."}
            </p>
          </div>
        )}
        <div className="card" style={{marginBottom:"1.3rem"}}>
          <h3 className="cg" style={{fontSize:"1.1rem",fontWeight:300,marginBottom:".3rem"}}>
            Simulación visual de <span className="gd">metamerismo</span>
            {season&&s&&<span style={{fontSize:".72rem",color:"var(--st)",fontFamily:"Jost,sans-serif",marginLeft:".6rem"}}>· bases de {s.label}</span>}
          </h3>
          <div className="div"/>
          {!season&&<p style={{fontSize:".78rem",color:"var(--st)",marginBottom:"1rem",fontStyle:"italic"}}>Completa el quiz para ver las bases específicas de tu estación.</p>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:".8rem"}}>
            {(season?BASE_HEX[season]:[
              {ref:"Cálida clara",h:"#F0B48C",nota:"Primavera"},
              {ref:"Fría clara",h:"#E8CCCA",nota:"Verano"},
              {ref:"Cálida profunda",h:"#C8A07A",nota:"Otoño"},
              {ref:"Fría profunda",h:"#E4CECC",nota:"Invierno"},
            ]).map((b,i)=>(
              <div key={i}>
                <div style={{height:70,borderRadius:10,background:b.h,filter:light?.f||"none",border:"1px solid rgba(200,169,126,.2)",marginBottom:".5rem",transition:"filter .6s ease",boxShadow:"0 2px 8px rgba(0,0,0,.25)"}}/>
                <div style={{fontSize:".75rem",fontWeight:500,color:"var(--wt)",lineHeight:1.3}}>{b.ref}</div>
                <div style={{fontSize:".66rem",color:"var(--st)",marginTop:".12rem"}}>{b.nota}</div>
                <div style={{fontSize:".6rem",fontFamily:"monospace",color:"rgba(200,169,126,.35)",marginTop:".08rem"}}>{b.h}</div>
              </div>
            ))}
          </div>
          {season&&s&&(
            <div style={{marginTop:"1rem",padding:".7rem .9rem",background:"rgba(200,169,126,.05)",borderRadius:8,border:"1px solid rgba(200,169,126,.12)"}}>
              <p style={{fontSize:".75rem",color:"var(--st)"}}>
                <span style={{color:light?.col}}>⚠️</span> Bajo <strong style={{color:light?.col}}>{light?.n}</strong> (CRI {light?.cri}){light?.cri<85?" los subtonos se distorsionan — lo que ves no es el color real de la base.":" el color se mantiene próximo al real."}
              </p>
            </div>
          )}
          <p style={{fontSize:".67rem",color:"rgba(245,237,224,.22)",marginTop:".8rem",fontStyle:"italic"}}>
            {season?"Hex aproximados de tus bases recomendadas. El efecto real varía según pigmento y formulación.":"Completa el quiz para ver tus bases específicas."}
          </p>
        </div>
        <div className="info">
          <b>Protocolo ISO 3668:</b> valida siempre bajo D65. ΔE &lt; 2 = fiable en cualquier entorno. Falla D65 → no recomendar. Solo falla LED barato → usar con reservas.
        </div>
        {season&&<div style={{textAlign:"center",marginTop:"1.4rem"}}>
          <button className="btn btn-g" onClick={()=>setScreen("results")}>← Mis resultados</button>
        </div>}
      </div>
    </div>
  );

  return null;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
